<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision of important topics</title>
</head>

<body>

    <script>
        console.log('Rest Parameter in array destructuring');
        const numbers = [1, 2, 3, 4, 5, 6];

        const [first, second, ...rest] = numbers;

        console.log(first);
        console.log(rest);  // (4) [3, 4, 5, 6]


        // console.log('Object Destructuring ');
        // const person = {
        //     name: 'John',
        //     age: 30,
        //     city: 'New York'
        // };

        // const { name, age, city } = person;
        // console.log(name);
        // console.log(age);
        // console.log(city);

        console.log('Nested Destructuring');
        const person1 = {
            name: 'John',
            address: {
                city: 'New York',
                zip: '10001'
            }
        };
        const { name, address: { city, zip } } = person1;

        console.log(name);
        console.log(city);
        console.log(zip);


        console.log("Function Parameters");
        const displayPerson = ({ name, age }) => {
            console.log(`Name: ${name}, Age: ${age}`);
        };
        const person = {
            name: 'Sujan',
            age: 26
        }
        displayPerson(person);


        console.log("Combined Array and Object Destructuring");
        const data = {
            name1: 'John',
            age: 30,
            hobbies: ['reading', 'traveling', 'swimming']
        };

        const { name1, age, hobbies: [firstHobby, secondHobby] } = data;

        console.log(name1);
        console.log(age);
        console.log(firstHobby);
        console.log(secondHobby);


        console.log('Spread Operator');
        console.log("The spread operator makes it easy to copy and paste");
        const array = [1, 2, 3, 4, 5, 6]
        const array1 = [...array];
        console.log(array1);
        // console.log(...array);

        console.log("Combinig Arrays");
        const arr1 = [1, 2, 3, 2]
        const arr2 = [3, 4, 5]
        const combinedArray = [...arr1, ...arr2]
        console.log(combinedArray);

        console.log("Spread in Function Calls");
        function addNum(x, y, z) {
            return x + y + z;
        }
        const num = [1, 2, 3]
        console.log(addNum(...num));

        console.log("Spread with Strings");

        const str = 'SUJAN';
        console.log([...str]);
        console.log({ ...str });
        console.log(...str);

        console.log("Ternary Operators");
        console.log('condition ? expressionIfTrue : expressionIfFalse;');
        const myAge = 25;
        const canVote = myAge >= 18 ? 'You can Vote' : "You can not Vote";
        console.log(canVote);

        // const isLoggedIn = true;
        // const userStatus = isLoggedIn ? 'Welcome' : 'Please Login';
        // console.log(userStatus);

        const isLoggedIn = true;

        const message = (
            isLoggedIn ? 'Welcome Back' : 'Please Sign Up'
        );

        console.log(message);


        const score = 30;
        const grade = score >= 90 ?
            "A+"
            : score >= 80
                ? "A"
                : score >= 70
                    ? "B+"
                    : score >= 60
                        ? "B"
                        : score >= 50
                            ? "C+"
                            : score >= 40
                                ? 'Pass'
                                : "You are Fail";
        console.log(grade);

        const age1 = 15;
        const message1 = age1 >= 18
            ? "You are an adult."
            : age >= 13
                ? "You are a teenager."
                : "You are a child.";

        console.log(message1);

        console.log("Promises in JS");
        console.log("Promise is an object that represent the eventual completion or rejction of an asynchronous operation");
        console.log('It has three states : Pending, Fulfilled and Rejected');
        const promise = new Promise((res, rej) => {
            const success = true;
            if (success) {
                res("Operation Succeeded");
            } else {
                rej("Operation Failed")
            }
        }).then((result) => {
            console.log(result);
        }).catch((err) => {
            console.log(err);
        })


        console.log("You can chain multiple .then() calls to perform a sequence of asynchronous operations.");

        const fetchData = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve("Data Fetched");
            }, 1000)
        })

        fetchData.
            then((result) => {
                console.log(result);
                return 'Processed data';
            }).then((result) => {
                console.log(result);
                return 'Aggain processed ....';
            }).then((result) => {
                console.log(result);
            }).catch((err) => {
                console.log(err);
            })


        console.log("Finally methods");
        const myPromise = new Promise((resolve, reject) => {
            setTimeout(() => {
                resolve('Operation succeeded');
            }, 1000);
        });

        myPromise
            .then(result => {
                console.log(result); // Output: Operation succeeded
            })
            .catch(error => {
                console.error(error);
            })
            .finally(() => {
                console.log('Operation completed'); // Always executed
            });

        // Real world example:

        fetch('https://jsonplaceholder.typicode.com/posts')
            .then((response) => {
                if (!response.ok) {
                    throw new Error('Network response was not ok')
                }
                return response.json();
            })
            .then((data) => {
                console.log(data);
            })
            .catch((error) => {
                console.error("There has been a problem with your fetch operation:", error)
            })


        // Using the async-await methods for fetching data...
        const fetchPosts = async () => {
            try {
                const response = await fetch("https://jsonplaceholder.typicode.com/posts");
                if (!response.ok) {
                    throw new Error("Network error occured")
                }
                const data = await response.json();
                console.log(data);
            } catch (error) {
                console.log("Error occured", error);
            }
        }

        // call the async function
        setTimeout(() => {
            fetchPosts();
        }, 3000);


        console.log("Callback");
        function add(a, b) {
            return a + b;
        }

        function divide(a, b) {
            return a / b;
        }

        function calculator(a, b, operationCallback) {
            return operationCallback(a, b);
        }

        console.log(calculator(8, 2, add));
        console.log(calculator(8, 2, divide));

        // Another callback examples
        function getData(dataId, getNextData) {
            setTimeout(() => {
                console.log("Data", dataId);
                if (getNextData) {
                    getNextData();
                }
            }, 2000);

        }
        // getData(1);
        // getData(2);

        // callback hell 
        // Callback hell, also known as "Pyramid of Doom," occurs when there are multiple nested callbacks, making the code difficult to read and maintain. 
        // getData(1, () => {
        //     console.log("Data 2 fetching....");
        //     getData(2, () => {
        //         console.log("Data 3 fetching...");
        //         getData(3)
        //     })
        // });

        function fetchDatas(url, callback) {
            // Simulating an asynchronous fetch operation
            setTimeout(() => {
                callback(null, `${url} data`);
            }, 1000);
        }

        // callback hell
        fetchDatas('https://api.example.com/user', (error, userData) => {
            if (error) {
                console.error('Error fetching user data:', error);
            } else {
                console.log('User data:', userData);

                fetchDatas('https://api.example.com/user/posts', (error, postsData) => {
                    if (error) {
                        console.error('Error fetching user posts:', error);
                    } else {
                        console.log('Posts data:', postsData);

                        fetchDatas('https://api.example.com/posts/comments', (error, commentsData) => {
                            if (error) {
                                console.error('Error fetching comments:', error);
                            } else {
                                console.log('Comments data:', commentsData);
                                // More nested callbacks can follow...
                            }
                        });
                    }
                });
            }
        });


    </script>
</body>
