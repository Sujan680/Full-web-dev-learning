<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revision of important topics</title>
</head>

<body>

    <script>
        console.log('Rest Parameter in array destructuring');
        const numbers = [1, 2, 3, 4, 5, 6];

        const [first, second, ...rest] = numbers;

        console.log(first);
        console.log(rest);  // (4) [3, 4, 5, 6]


        console.log('Object Destructuring ');
        const person = {
            name: 'John',
            age: 30,
            city: 'New York'
        };

        const {name, age, city} = person;
        console.log(name);
        console.log(age);
        console.log(city);
    </script>
</body>

</html>
