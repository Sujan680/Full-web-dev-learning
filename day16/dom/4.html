<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom in js</title>
</head>
<body style="background-color: black; color: white;">
    <ul class="language">
        <li>Javascript</li>
    </ul>

    <script>
        function addLang(name){
            const li=document.createElement('li');
            li.innerHTML = `${name}`
            document.querySelector('.language').appendChild(li)
        }
        addLang("Python")
        addLang("HTML")
        addLang("CSS")


        function addOptiLang(name){
            const li = document.createElement('li')
            li.appendChild(document.createTextNode(name))
            document.querySelector('.language').appendChild(li)
        }
        addOptiLang("Golang")

        //Edit

    const secLang = document.querySelector('li:nth-child(2)');
    //    secLang.innerHTML = "MOJO";
    const newLi = document.createElement('li')
    newLi.textContent = "Mojo"
    secLang.replaceWith(newLi)

    const firstLang = document.querySelector('li:first-child')
    firstLang.outerHTML = '<li>Typescript</li>';
    // const newLi = document.createElement('li');
    // newLi.textContent = "SUJAN"
    // firstLang.replaceWith(newLi)

    // Remove

    const lastLang = document.querySelector('li:last-child')
    lastLang.remove();
    </script>
</body>
</html>
