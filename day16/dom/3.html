<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom in js</title>
</head>
<body style="background-color: gray; color: white ">
    hi

    <script>
        const div = document.createElement('div')
        console.log(div);
        div.className = 'main'
        div.id = Math.round(Math.random() * 10 +1)
        div.setAttribute("title", "generated title")
        div.style.color = "red"
        div.style.backgroundColor = "blue"
        div.style.padding ="10px"
        // div.innerText = "Sujan Magar"
       const addtext = document.createTextNode("Sujan Magar");
       div.appendChild(addtext);
       document.body.appendChild(div)

       // Adding text
       const para = document.createElement("p");
       console.log(para);
        para.className = "text"
        const addpara = document.createTextNode("hi my name is sujan magar from the top of the world")
        para.appendChild(addpara)
        document.body.appendChild(para)
    </script>
</body>
</html>
