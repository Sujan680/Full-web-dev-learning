    <h2>Redeclaring a Variable Using let</h2>
    <p>Redeclaring a variable with let, in another scope, or in another block, is allowed:</p>

    <p id="demo"></p>

    <script>
        let x = 10;
        // Here x is 10

        {
            let x = 2;
            // Here x is 2
        }

        {
            let x = 45;
            // allowed in another block
        }

        // Here x is 10
        document.getElementById("demo").innerHTML = x;
    </script>
