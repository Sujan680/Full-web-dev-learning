<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS grid challenge</title>
   <style>
    *{
        margin: 0;
        padding: 0;
    }
     .container{
        /* background-color: antiquewhite; */
        display: grid;
        grid-template-columns: 250px 250px 250px;
        grid-auto-rows: 130px;
        column-gap: 20px;
        row-gap: 10px;
        margin: 20px;
        padding: 20px;
        border-radius: 10px;
        justify-content: center;
        align-items: center;
     }
     .box{
        border-radius: 5px;
        /* border: 1px solid red; */
        text-align: center;
        background-color: azure;
        padding: 10px;
        box-shadow: rgba(50, 50, 93, 0.25) 0px 13px 27px -5px, rgba(0, 0, 0, 0.3) 0px 8px 16px -8px;
     }
     .btn {
        margin-top: 30px;
        outline-style: none;
        border-style: none;
     }
     .box .btn-1 {
        padding: 3px;
        background-color: rgb(17, 17, 228);
        color: white;
        border-radius: 10px;
     }
     .box p{
        font-family: cursive;
     }
     .box .btn-2{
        padding: 3px;
        background-color: rgb(255, 81, 0);
        border-radius: 10px;
        color: white;
     }

     @media screen and (max-width:800px) {
        .container{
            grid-template-columns: 200px;
            row-gap: 30px;
        
        }
        .box{
            width: 50vw;
        }
     }
     @media screen and (max-width:510px) {
        .container{
            grid-template-columns: 200px;
            row-gap: 30px;
        
        }
        .box{
            width: 60vw;
        }
     }
     @media screen and (max-width:320px) {
        .container{
            grid-template-columns: 200px;
            row-gap: 50px;
        
        }
        .box{
            width: 70vw;
        }
     }
    
   </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <h2>English</h2>
            <p>english</p>
            <button class="btn btn-1">Download 32-bit</button>
            <button class="btn btn-2">Download 64-bit</button>
        </div>
        <div class="box">
            <h2>Deutsch</h2>

</html>
