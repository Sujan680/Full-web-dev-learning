<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox navbar in css</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        nav {
            background-color: whitesmoke;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            padding: 20px;
        }

        nav .nav-items {
            display: flex;
            gap: 10px;
            justify-content:center;
            align-items: center;
        }

        .nav-items a {
            text-decoration: none;
            font-size: 10px;
        }
         .fa-language{
            font-size: 25px;
        }
        .fa-sharp{
            padding-right: 30px;
        }

        @media screen and (min-width:800px) {
            nav img{
                width: 200px;
            }
            .nav-items a{
                font-size: 20px;
            }
        }

       
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="logo.webp" alt="logo" width="100">
            </div>
            <div class="nav-items">
                <a href="">Products</a><i class="fa-sharp fa-solid fa-angle-down"></i>
                <a href="">Pricing</a><i class="fa-sharp fa-solid fa-angle-down"></i>
                <a href="">Resources</a><i class="fa-sharp fa-solid fa-angle-down"></i>
                <a href="">About us</a><i class="fa-sharp fa-solid fa-angle-down"></i>
                <a href="">Security and Compliance</a><i class="fa-sharp fa-solid fa-angle-down"></i>
                <span><i class="fa-sharp fa-solid fa-language" ></i></span>
            </div>
        </nav>
    </header>
</body>

</html>
