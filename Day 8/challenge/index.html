<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge</title>
    <style>
        .container{
            background-color: blue;
            width: 100vw;
            height: 60vh;
            position: relative;
        
        }
        .box{
            background-color: red;
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation: animateX 3s linear infinite, animateY 1s ease-out infinite alternate;
        }
        @keyframes animateX {
          
            from{
                left: 0;
            }
            to{
                left: 100%;
            }
        }

        @keyframes animateY {
          
          from{
              bottom: 0;
          }
          to{
              bottom: 100%;
          }
      }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
