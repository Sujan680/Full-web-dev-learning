<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Challenge</title>
    <style>
        .container{
            background-color: blue;
            width: 90vw;
            height: 50vh;
            position: relative;
            top: 0;
            left: 0;
        }
        .box{
            background-color: red;
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            animation: BounceAnimation 4s ease-in-out 2s infinite forwards;
        }
        @keyframes BounceAnimation {
            0%{
                transform: translateY(-200px);
            }
            50%{
                transform: translate(100px);
            }
            75%{
                transform: translateX(100px);
            }
            100%{
                transform: translateX(100px);
            }  
        }
        /* @keyframes Sujan2 {
            0%{transform: translateY(200px);}
            25%{transform: rotateY();}
            50%{transform: rotateY(150deg);}
            75%{transform: rotateY(200deg);}
            100%{transform: rotateY(360deg);}
        } */
    </style>
</head>
<body>
    <div class="container">
        <div class="box">

        </div>
    </div>
</body>
</html>
