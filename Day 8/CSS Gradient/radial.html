<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radial CSS</title>
    <style>
        .grad1{
            height: 200px;
            background-image: radial-gradient(red , yellow, green);
        }
        .grad2{
            height: 200px;
            background-image: radial-gradient(red 5%, yellow 15%, green 70%);
          }
        .grad3{
            margin-top: 20px;
            height: 400px;
            background-image: radial-gradient(circle, red, yellow, green);
          }
          .grad4 {
            margin-top: 30px;
            height: 300px;
            padding: 20px;
            background-image: repeating-radial-gradient(red, yellow 10%, green 15%);
          }
    </style>
</head>
<body>
    <div class="grad1">

    </div>
    <div class="grad2">

    </div>
    <div class="grad3">

    </div>
    <div class="grad4">

    </div>
</body>
</html>
