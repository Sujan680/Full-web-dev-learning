<!DOCTYPE html>
<html>

<head>
    <style>
        .example {
            width: 100px;
            height: 100px;
            background: red;
            transition: width 2s, height 2s, transform 2s;
        }

        .example:hover {
            width: 300px;
            height: 300px;
            transform: rotate(360deg);
            /* transform: translate(200px); */
        }
        .more{
            background-color: blue;
            width: 40px;
            height: 60px;
            transition: width 3s ease 0.3s, height 6s, transform 2s;
        }
        .more:hover{
            width: 200px;
            height: 300px;
            transform: rotate(360deg);
        }
    </style>
</head>

<body>

    <h1>Transition + Transform</h1>

    <p>Hover over the div element below:</p>

    <div class="example"></div>

    <h2>More on transition</h2>
    <div class="more">

    </div>

</body>

</html>
